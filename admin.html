<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智庫管理後台｜陳家蜂蜜</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body>
<header><a href="index.html">← 回養蜂智庫</a><b>陳家蜂蜜・智庫管理後台</b></header>
<main><section id="loginPanel" class="panel login"><p class="eyebrow">ADMIN LOGIN</p><h1>管理員登入</h1><p>輸入管理密碼後，即可新增論文、圖片與其他知識檔案。</p><form id="loginForm"><label>密碼<input id="password" type="password" required autocomplete="current-password"></label><button>登入</button><p class="status" id="loginStatus"></p></form></section>
<section id="adminPanel" hidden><div class="heading"><div><p class="eyebrow">KNOWLEDGE UPLOAD</p><h1>新增智庫內容</h1><p>選檔案、選分類、按上傳，就完成了。</p></div><button class="quiet" id="logout">登出</button></div><div class="grid"><form id="uploadForm" class="panel"><div class="step"><b>1</b><label>選擇檔案<span>任何格式都可以</span><input name="file" type="file" required></label></div><div class="step"><b>2</b><label>選擇分類<select name="category"><option value="management">蜂群管理</option><option value="health">蜜蜂健康</option><option value="honey">蜂蜜知識</option><option value="ecology">環境生態</option><option value="brand">陳家故事</option></select></label></div><label>顯示標題（可不填）<input name="title" placeholder="不填就自動使用檔名"></label><details><summary>補充摘要、關鍵字與來源（選填）</summary><label>內容摘要<textarea name="summary" rows="6" placeholder="上傳圖片、影片或特殊格式時，建議在這裡說明內容"></textarea></label><label>關鍵字<input name="keywords" placeholder="例如：蜂蟹蟎、死亡、治療"></label><label>資料來源<input name="source" placeholder="作者、期刊或網站名稱"></label><label>標籤<input name="tag" placeholder="例如：最新論文"></label></details><button class="upload-main" id="uploadButton"><span>3</span> 上傳並更新智庫</button><p class="status" id="uploadStatus"></p></form><aside class="panel note"><h2>上傳後</h2><ol><li>原始檔案保存在後端</li><li>內容立即出現在公開知識庫</li><li>問答會自動使用新資料回答</li></ol><p><b>文件：</b>PDF、Word、文字檔會自動讀取內容。</p><p><b>圖片或影片：</b>請展開選填區，補一句摘要，問答才知道檔案內容。</p></aside></div><section class="panel records"><h2>已上傳內容</h2><div id="records"></div></section></section></main><script src="admin.js"></script></body></html>
